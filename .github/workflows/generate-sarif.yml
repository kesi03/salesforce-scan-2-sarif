name: Generate Salesforce SARIF

on:
  workflow_dispatch:
    inputs:
      repo:
        type: choice
        description: "Choose a Salesforce repo to scan"
        options:
          - trailheadapps/apex-recipes
          - trailheadapps/lwc-recipes
          - trailheadapps/dreamhouse-lwc
          - apex-enterprise-patterns/fflib-apex-common
          - jongpie/NebulaLogger
        required: true

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # Checkout your CLI tool
      # ---------------------------------------------------------
      - name: Checkout this tool
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # Setup Node.js 22
      # ---------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ---------------------------------------------------------
      # Enable pnpm
      # ---------------------------------------------------------
      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@9.0.0 --activate

      - name: Setup PNPM_HOME (deterministic)
        run: |
          export PNPM_HOME="$HOME/.pnpm"
          mkdir -p "$PNPM_HOME"
          echo "PNPM_HOME=$PNPM_HOME" >> $GITHUB_ENV
          echo "$PNPM_HOME" >> $GITHUB_PATH
          pnpm config set global-bin-dir "$PNPM_HOME"

      # ---------------------------------------------------------
      # Install Salesforce CLI
      # ---------------------------------------------------------
      - name: Install Salesforce CLI (pnpm)
        run: pnpm add -g @salesforce/cli

      - name: Verify Salesforce CLI
        run: sf --version

      # ---------------------------------------------------------
      # Install Salesforce Code Analyzer plugin (correct name)
      # ---------------------------------------------------------
      - name: Install Salesforce Code Analyzer plugin
        run: sf plugins install @salesforce/code-analyzer

      - name: Verify Code Analyzer plugin
        run: sf plugins

      # ---------------------------------------------------------
      # Verify your CLI
      # ---------------------------------------------------------
      - name: Verify CLI
        run: pnpm sfs2s --help

      # ---------------------------------------------------------
      # Clone the Salesforce repo chosen by the user
      # ---------------------------------------------------------
      - name: Clone Salesforce repo
        run: git clone https://github.com/${{ inputs.repo }} repo-to-scan

      # ---------------------------------------------------------
      # Discover PMD / ESLint / SARIF files
      # ---------------------------------------------------------
      - name: Discover files
        run: pnpm sfs2s discover repo-to-scan > discovery.json

      # ---------------------------------------------------------
      # Convert PMD + ESLint → SARIF
      # ---------------------------------------------------------
      - name: Convert PMD + ESLint
        run: |
          mkdir -p sarif-output
          pnpm sfs2s convert all repo-to-scan sarif-output || true

      # ---------------------------------------------------------
      # Merge PMD + ESLint SARIF → unified SARIF
      # ---------------------------------------------------------
      - name: Merge SARIF
        run: pnpm sfs2s merge repo-to-scan sarif-output || true

      # ---------------------------------------------------------
      # Bundle all SARIF files into one
      # ---------------------------------------------------------
      - name: Bundle SARIF
        run: pnpm sfs2s bundle sarif-output sarif-output/unified.sarif

      # ---------------------------------------------------------
      # Validate final SARIF
      # ---------------------------------------------------------
      - name: Validate SARIF
        run: pnpm sfs2s validate sarif-output/unified.sarif

      # ---------------------------------------------------------
      # Upload SARIF artifact
      # ---------------------------------------------------------
      - name: Upload SARIF artifact
        uses: actions/upload-artifact@v4
        with:
          name: salesforce-scan-${{ inputs.repo }}
          path: sarif-output/unified.sarif

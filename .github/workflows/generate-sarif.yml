name: Generate Salesforce SARIF

on:
  workflow_dispatch:
    inputs:
      repo:
        type: choice
        description: "Choose a Salesforce repo to scan"
        options:
          - trailheadapps/apex-recipes
          - trailheadapps/lwc-recipes
          - trailheadapps/dreamhouse-lwc
          - apex-enterprise-patterns/fflib-apex-common
          - jongpie/NebulaLogger
        required: true

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this tool
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ---------------------------------------------------------
      # pnpm for your project
      # ---------------------------------------------------------
      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@9.0.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Make CLI executable
        run: chmod +x src/cli.ts

      # ---------------------------------------------------------
      # npm for Salesforce CLI (required)
      # ---------------------------------------------------------
      - name: Install Salesforce CLI (npm)
        run: npm install --global @salesforce/cli

      - name: Verify Salesforce CLI
        run: sf --version

      # ---------------------------------------------------------
      # Install Salesforce Code Analyzer plugin
      # ---------------------------------------------------------
      - name: Install Salesforce Code Analyzer plugin
        run: sf plugins install code-analyzer

      - name: Verify Code Analyzer plugin
        run: sf plugins

      # ---------------------------------------------------------
      # Clone the Salesforce repo chosen by the user
      # ---------------------------------------------------------
      - name: Clone Salesforce repo
        run: git clone https://github.com/${{ inputs.repo }} repo-to-scan

      # ---------------------------------------------------------
      # Run your CLI to scan and produce unified SARIF
      # ---------------------------------------------------------
      - name: Run Salesforce scan
        run: pnpm exec sales-force-scan-2-sarif scan repo-to-scan/force-app sarif-output

      # ---------------------------------------------------------
      # Upload SARIF artifact
      # ---------------------------------------------------------
      - name: Upload SARIF artifact
        uses: actions/upload-artifact@v4
        with:
          name: salesforce-scan-${{ inputs.repo }}
          path: sarif-output/salesforce-unified.sarif

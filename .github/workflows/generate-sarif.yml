name: Generate SARIF Reports

on:
  workflow_dispatch:
    inputs:
      repo:
        type: choice
        description: "Choose a Salesforce repo to scan"
        options:
          - trailheadapps/apex-recipes
          - trailheadapps/lwc-recipes
          - trailheadapps/dreamhouse-lwc
          - apex-enterprise-patterns/fflib-apex-common
          - jongpie/NebulaLogger
        required: true

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      # ---------------------------------------------------------
      # Checkout your CLI tool
      # ---------------------------------------------------------
      - name: Checkout this tool
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # Setup Node.js 22
      # ---------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ---------------------------------------------------------
      # Setup Python for pip-installed security tools
      # ---------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Checkov
        run: python -m pip install --upgrade pip checkov

      - name: Verify Checkov
        run: checkov --version

      # ---------------------------------------------------------
      # Enable pnpm and install this CLI
      # ---------------------------------------------------------
      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@9.0.0 --activate
          export PNPM_HOME="$HOME/.pnpm"
          mkdir -p "$PNPM_HOME"
          echo "PNPM_HOME=$PNPM_HOME" >> "$GITHUB_ENV"
          echo "$PNPM_HOME" >> "$GITHUB_PATH"
          pnpm config set global-bin-dir "$PNPM_HOME"
          pnpm install --frozen-lockfile

      # ---------------------------------------------------------
      # Install Salesforce CLI
      # ---------------------------------------------------------
      - name: Install Salesforce CLI (pnpm)
        run: pnpm add -g @salesforce/cli

      - name: Verify Salesforce CLI
        run: sf --version

      # ---------------------------------------------------------
      # Verify Salesforce Code Analyzer
      # ---------------------------------------------------------
      - name: Verify Code Analyzer
        run: sf code-analyzer --help

      # ---------------------------------------------------------
      # Verify your CLI
      # ---------------------------------------------------------
      - name: Verify CLI
        run: pnpm sarif-tools --help

      # ---------------------------------------------------------
      # Clone the Salesforce repo chosen by the user
      # ---------------------------------------------------------
      - name: Clone Salesforce repo
        run: git clone https://github.com/${{ inputs.repo }} repo-to-scan

      # ---------------------------------------------------------
      # Run Salesforce Code Analyzer and write native SARIF output
      # ---------------------------------------------------------
      - name: Analyze Salesforce repo
        run: |
          mkdir -p sarif-output
          sf code-analyzer run \
            --workspace repo-to-scan \
            --target repo-to-scan \
            --output-file sarif-output/code-analyzer.sarif


      # ---------------------------------------------------------
      # Run Checkov and write native SARIF output
      # ---------------------------------------------------------
      - name: Run Checkov
        run: |
          mkdir -p sarif-output
          checkov \
            -d repo-to-scan \
            --output sarif \
            --output-file-path sarif-output \
            --soft-fail

      # ---------------------------------------------------------
      # Install Gitleaks and run it to generate SARIF output
      # ---------------------------------------------------------
      - name: Install Gitleaks
        run: |
          set -euo pipefail
          download_url="$(curl -fsSL https://api.github.com/repos/gitleaks/gitleaks/releases/latest \
            | grep -o 'https://[^"]*gitleaks_[^"]*_linux_x64\.tar\.gz' \
            | head -n 1)"
          curl -fsSL "$download_url" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          install -m 0755 /tmp/gitleaks "$HOME/.local/bin/gitleaks"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          gitleaks version

      #---------------------------------------------------------
      # Run Gitleaks and generate SARIF output
      #---------------------------------------------------------  
      - name: Run Gitleaks and generate SARIF
        run: |
          mkdir -p sarif-output
          gitleaks detect \
            --source repo-to-scan \
            --report-format sarif \
            --report-path sarif-output/gitleaks.sarif \
            --no-banner

      # ---------------------------------------------------------
      # Bundle all SARIF files into one
      # ---------------------------------------------------------
      - name: Bundle SARIF
        run: pnpm sarif-tools bundle sarif-output sarif-output/unified.sarif

      # ---------------------------------------------------------
      # Validate final SARIF
      # ---------------------------------------------------------
      - name: Validate SARIF
        run: pnpm sarif-tools validate sarif-output/unified.sarif

      # ---------------------------------------------------------
      # Publish findings to GitHub Code Scanning
      # ---------------------------------------------------------
      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: sarif-output/unified.sarif
          category: salesforce-${{ inputs.repo }}

      # ---------------------------------------------------------
      # Generate human-readable reports
      # ---------------------------------------------------------
      - name: Generate Markdown and HTML reports
        run: |
          pnpm sarif-tools report sarif-output/unified.sarif sarif-output/unified.md
          pnpm sarif-tools report sarif-output/unified.sarif sarif-output/unified.html
          pnpm sarif-tools report sarif-output/unified.sarif sarif-output/unified.junit.xml

      # ---------------------------------------------------------
      # Create a filesystem-safe artifact name
      # ---------------------------------------------------------
      - name: Prepare artifact name
        run: |
          safe_repo="${{ inputs.repo }}"
          safe_repo="${safe_repo//\//-}"
          echo "ARTIFACT_NAME=sarif-tools-${safe_repo}" >> "$GITHUB_ENV"

      # ---------------------------------------------------------
      # Upload SARIF artifact
      # ---------------------------------------------------------
      - name: Upload SARIF artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            sarif-output/unified.sarif
            sarif-output/unified.md
            sarif-output/unified.html
            sarif-output/unified.junit.xml

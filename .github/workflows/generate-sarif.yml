name: Generate Salesforce SARIF

on:
  workflow_dispatch:
    inputs:
      repo:
        type: choice
        description: "Choose a Salesforce repo to scan"
        options:
          - trailheadapps/apex-recipes
          - trailheadapps/lwc-recipes
          - trailheadapps/dreamhouse-lwc
          - apex-enterprise-patterns/fflib-apex-common
          - jongpie/NebulaLogger
        required: true

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # Checkout your CLI tool
      # ---------------------------------------------------------
      - name: Checkout this tool
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # Setup Node.js 22
      # ---------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ---------------------------------------------------------
      # Enable pnpm and install this CLI
      # ---------------------------------------------------------
      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@9.0.0 --activate
          pnpm install --frozen-lockfile

      # ---------------------------------------------------------
      # Install Salesforce CLI
      # ---------------------------------------------------------
      - name: Install Salesforce CLI (pnpm)
        run: pnpm add -g @salesforce/cli

      - name: Verify Salesforce CLI
        run: sf --version

      # ---------------------------------------------------------
      # Verify Salesforce Code Analyzer
      # ---------------------------------------------------------
      - name: Verify Code Analyzer
        run: sf code-analyzer --help

      # ---------------------------------------------------------
      # Verify your CLI
      # ---------------------------------------------------------
      - name: Verify CLI
        run: pnpm sfs2s --help

      # ---------------------------------------------------------
      # Clone the Salesforce repo chosen by the user
      # ---------------------------------------------------------
      - name: Clone Salesforce repo
        run: git clone https://github.com/${{ inputs.repo }} repo-to-scan

      # ---------------------------------------------------------
      # Run Salesforce Code Analyzer and write native SARIF output
      # ---------------------------------------------------------
      - name: Analyze Salesforce repo
        run: |
          mkdir -p sarif-output
          sf code-analyzer run \
            --workspace repo-to-scan \
            --target repo-to-scan \
            --output-file sarif-output/code-analyzer.sarif

      # ---------------------------------------------------------
      # Bundle all SARIF files into one
      # ---------------------------------------------------------
      - name: Bundle SARIF
        run: pnpm sfs2s bundle sarif-output sarif-output/unified.sarif

      # ---------------------------------------------------------
      # Validate final SARIF
      # ---------------------------------------------------------
      - name: Validate SARIF
        run: pnpm sfs2s validate sarif-output/unified.sarif

      # ---------------------------------------------------------
      # Upload SARIF artifact
      # ---------------------------------------------------------
      - name: Upload SARIF artifact
        uses: actions/upload-artifact@v4
        with:
          name: salesforce-scan-${{ inputs.repo }}
          path: sarif-output/unified.sarif

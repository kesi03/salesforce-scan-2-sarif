name: Generate Salesforce SARIF

on:
  workflow_dispatch:
    inputs:
      repo:
        type: choice
        description: "Choose a Salesforce repo to scan"
        options:
          - trailheadapps/apex-recipes
          - trailheadapps/lwc-recipes
          - trailheadapps/dreamhouse-lwc
          - apex-enterprise-patterns/fflib-apex-common
          - jongpie/NebulaLogger
        required: true

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # Checkout your CLI tool
      # ---------------------------------------------------------
      - name: Checkout this tool
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # Setup Node.js 22
      # ---------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ---------------------------------------------------------
      # Enable pnpm
      # ---------------------------------------------------------
      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@9.0.0 --activate

      # ---------------------------------------------------------
      # Install your CLI globally
      # ---------------------------------------------------------
      - name: Install CLI globally
        run: pnpm add -g @mockholm/sales-force-scan-2-sarif

      - name: Verify CLI
        run: sales-force-scan-2-sarif --help

      # ---------------------------------------------------------
      # Clone the Salesforce repo chosen by the user
      # ---------------------------------------------------------
      - name: Clone Salesforce repo
        run: git clone https://github.com/${{ inputs.repo }} repo-to-scan

      # ---------------------------------------------------------
      # Discover PMD / ESLint / SARIF files
      # ---------------------------------------------------------
      - name: Discover files
        run: sales-force-scan-2-sarif discover repo-to-scan > discovery.json

      # ---------------------------------------------------------
      # Convert PMD + ESLint → SARIF (if present)
      # ---------------------------------------------------------
      - name: Convert PMD + ESLint
        run: |
          mkdir -p sarif-output
          sales-force-scan-2-sarif convert all repo-to-scan sarif-output || true

      # ---------------------------------------------------------
      # Merge PMD + ESLint SARIF → unified SARIF
      # ---------------------------------------------------------
      - name: Merge SARIF
        run: sales-force-scan-2-sarif merge repo-to-scan sarif-output || true

      # ---------------------------------------------------------
      # Bundle all SARIF files into one
      # ---------------------------------------------------------
      - name: Bundle SARIF
        run: sales-force-scan-2-sarif bundle sarif-output sarif-output/unified.sarif

      # ---------------------------------------------------------
      # Validate final SARIF
      # ---------------------------------------------------------
      - name: Validate SARIF
        run: sales-force-scan-2-sarif validate sarif-output/unified.sarif

      # ---------------------------------------------------------
      # Upload SARIF artifact
      # ---------------------------------------------------------
      - name: Upload SARIF artifact
        uses: actions/upload-artifact@v4
        with:
          name: salesforce-scan-${{ inputs.repo }}
          path: sarif-output/unified.sarif
